<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電力技術 2学期期末テスト対策 50問</title>
<style>
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.65;margin:0;background:#f5f6f8;color:#202124}
  main{max-width:850px;margin:auto;padding:20px}
  h1{font-size:1.5rem} .intro,.question,.result{background:white;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 1px 4px #0001}
  .question h3{font-size:1rem;margin:0 0 10px}
  label{display:block;padding:7px 9px;border-radius:8px;cursor:pointer}
  label:hover{background:#f0f3f7}
  input{margin-right:8px}
  button{border:0;border-radius:9px;padding:12px 18px;font-size:1rem;cursor:pointer;background:#2457c5;color:white;margin:8px 6px 8px 0}
  button.secondary{background:#5c6470}
  button:disabled{opacity:.45;cursor:not-allowed}
  .muted{color:#606770;font-size:.92rem}
  .correct{background:#e7f5eb}.wrong{background:#fff0ef}
  .answer{font-weight:700;margin-top:8px}
  #progress{font-weight:700}
  @media print{body{background:white}.intro button,#submit,#reset{display:none}.question{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style>
</head>
<body>
<main>
<h1>電力技術 2学期期末テスト対策（全50問）</h1>
<div class="intro">
  <p>原子力発電のしくみ・原子核・放射線・原子炉の構成についての4択問題です。</p>
  <p class="muted">各問1つ選択してください。全問回答したら「採点する」を押してください。</p>
  <p id="progress">回答済み：0 / 50問</p>
  <button id="submit" disabled>採点する</button>
  <button id="reset" class="secondary">最初からやり直す</button>
</div>
<div id="quiz"></div>
<div id="result" class="result" hidden></div>
</main>
<script>
const questions = [
{q:"原子は何と何からできているか。",a:["原子核と電子","陽子と分子","中性子と分子","陽子と電流"],c:0},
{q:"原子核は何からできているか。",a:["電子と陽子","陽子と中性子","電子と中性子","分子と電子"],c:1},
{q:"原子番号が表すものは何か。",a:["陽子の数","中性子の数","陽子と中性子の合計","電子と中性子の合計"],c:0},
{q:"質量数は何の合計か。",a:["陽子と電子","電子と中性子","陽子と中性子","陽子と原子番号"],c:2},
{q:"同じ原子番号で、質量数が異なる原子を何というか。",a:["同素体","同位体","化合物","分子"],c:1},
{q:"放射線を出す同位体を何というか。",a:["安定同位体","放射性同位体","軽水炉","核燃料"],c:1},
{q:"放射線にはどのようなものがあるか。",a:["粒子線と電磁波","音波と水波","電流と電圧","熱と光だけ"],c:0},
{q:"次のうち粒子線に分類されるものはどれか。",a:["γ線","X線","α線","紫外線"],c:2},
{q:"次のうち電磁波に分類されるものはどれか。",a:["β線","中性子線","α線","γ線"],c:3},
{q:"放射線を出す能力を何というか。",a:["放射能","質量欠損","原子番号","結合力"],c:0},
{q:"放射線を出す物質を何というか。",a:["減速材","放射性物質","反射体","冷却材"],c:1},
{q:"陽子と中性子が結びつくとき、外部に放出されるエネルギーに関係するものは何か。",a:["原子番号","質量欠損","電子の数","電気抵抗"],c:1},
{q:"質量とエネルギーの関係を表す式はどれか。",a:["U=mc²","U=m/c","U=mc","U=c²/m"],c:0},
{q:"式 U=mc² の c は何を表すか。",a:["電流","真空中の光速","比熱","電圧"],c:1},
{q:"ヘリウム原子核は陽子を何個もつか。",a:["1個","2個","3個","4個"],c:1},
{q:"ヘリウム原子核は中性子を何個もつか。",a:["1個","2個","3個","4個"],c:1},
{q:"資料の例で、ヘリウム原子核の実際の質量はいくらか。",a:["4.032 u","4.002 u","0.030 u","1.007 u"],c:1},
{q:"資料の例で、ヘリウム原子核の質量欠損はいくらか。",a:["0.003 u","0.030 u","0.300 u","4.002 u"],c:1},
{q:"資料の例で、ヘリウム原子核の核子1個あたりの結合エネルギーはいくらか。",a:["1.12 MeV","4.00 MeV","6.99 MeV","27.96 MeV"],c:2},
{q:"1 MeVは何Jか。",a:["1.602×10⁻¹³ J","1.602×10⁻¹⁹ J","3.0×10⁸ J","9.32×10² J"],c:0},
{q:"235Uを1g核分裂させたとき、資料の計算で発生するエネルギーは約何Jか。",a:["8.1×10⁸ J","8.1×10⁹ J","8.1×10¹⁰ J","8.1×10¹² J"],c:2},
{q:"発生したエネルギーの32％が電気エネルギーになるとき、約何Jか。",a:["2.6×10⁸ J","2.6×10⁹ J","2.6×10¹⁰ J","2.6×10¹¹ J"],c:2},
{q:"2.6×10¹⁰ JをkWhに換算すると約何kWhか。",a:["720 kWh","7200 kWh","72000 kWh","720000 kWh"],c:1},
{q:"ウラン235が熱中性子を吸収すると、何が起こるか。",a:["核分裂","蒸発","凍結","電磁誘導"],c:0},
{q:"核分裂で発生した高速中性子を熱中性子にするものは何か。",a:["制御棒","減速材","遮へい体","発電機"],c:1},
{q:"核分裂が連続して起こる反応を何というか。",a:["核融合","連鎖反応","電離作用","電磁誘導"],c:1},
{q:"核分裂の割合が増加も減少もせず一定に保たれる状態を何というか。",a:["臨界状態","過熱状態","絶縁状態","放電状態"],c:0},
{q:"低速の熱中性子を使って核分裂を起こす原子炉は何か。",a:["高速中性子炉","熱中性子炉","核融合炉","ガス炉"],c:1},
{q:"高速中性子を使う原子炉は何か。",a:["熱中性子炉","軽水炉","高速中性子炉","高温ガス炉"],c:2},
{q:"減速材の役割は何か。",a:["高速中性子を熱中性子にする","熱を外へ運ぶ","放射線を遮る","発電機を回す"],c:0},
{q:"資料にある減速材の材料はどれか。",a:["カドミウムだけ","軽水・重水・黒鉛","コンクリートだけ","ヘリウムだけ"],c:1},
{q:"原子炉内で発生したエネルギーを外へ運び出すものは何か。",a:["反射体","制御棒","冷却材","遮へい体"],c:2},
{q:"資料にある冷却材の材料はどれか。",a:["軽水","カドミウム","コンクリート","黒鉛だけ"],c:0},
{q:"炉心を囲み、中性子が外へ漏れるのを防ぐものは何か。",a:["反射体","冷却材","制御棒","発電機"],c:0},
{q:"原子炉内で中性子を吸収し、核分裂の割合を調整するものは何か。",a:["減速材","制御棒","反射体","蒸気タービン"],c:1},
{q:"資料にある制御棒の材料はどれか。",a:["カドミウム","ヘリウム","銅","アルミニウム"],c:0},
{q:"炉心から出る有害な放射線を遮る壁を何というか。",a:["遮へい体","反射体","冷却材","加圧器"],c:0},
{q:"中性子を遮る材料として資料に示されているものはどれか。",a:["軽水","カドミウム","銅","黒鉛"],c:0},
{q:"γ線を遮る材料として資料に示されているものはどれか。",a:["軽水","コンクリート","ヘリウム","重水"],c:1},
{q:"炉心を入れ、内部の圧力を保ち、放射性物質を閉じ込める鋼鉄製の容器は何か。",a:["原子炉格納容器","原子炉圧力容器","復水器","気水分離器"],c:1},
{q:"原子炉や関連設備を収め、放射線を閉じ込める役割をもつ施設は何か。",a:["原子炉格納容器","原子炉圧力容器","加圧器","発電機"],c:0},
{q:"軽水炉で、冷却材と減速材の両方に使われるものは何か。",a:["重水","軽水","ヘリウム","黒鉛"],c:1},
{q:"軽水炉の燃料として使われるものはどれか。",a:["低濃縮ウラン","純粋な鉄","カドミウム","黒鉛"],c:0},
{q:"改良型軽水炉で、原子炉圧力容器の下部に直接組み込まれるものは何か。",a:["再循環ポンプ","発電機","変圧器","制御室"],c:0},
{q:"高速増殖炉で使用する燃料は何か。",a:["MOX燃料","石炭","天然ガス","軽油"],c:0},
{q:"高速増殖炉では、238Uが中性子を吸収して何をつくるか。",a:["235U","239Pu","水素","ヘリウム"],c:1},
{q:"高温ガス炉の冷却材は何か。",a:["軽水","重水","ヘリウムガス","二酸化炭素だけ"],c:2},
{q:"高温ガス炉の減速材は何か。",a:["黒鉛","カドミウム","コンクリート","銅"],c:0},
{q:"核融合炉では、主に何と何の原子核を衝突させるか。",a:["ウランとプルトニウム","重水素と三重水素","酸素と窒素","ヘリウムと炭素"],c:1}
];

const quiz = document.getElementById("quiz");
const progress = document.getElementById("progress");
const submit = document.getElementById("submit");
const result = document.getElementById("result");
const letters = ["A","B","C","D"];

questions.forEach((item,i)=>{
  const section=document.createElement("section");
  section.className="question";
  section.id="q"+i;
  const title=document.createElement("h3");
  title.textContent=`問${i+1}. ${item.q}`;
  section.appendChild(title);
  item.a.forEach((choice,j)=>{
    const label=document.createElement("label");
    const radio=document.createElement("input");
    radio.type="radio"; radio.name="q"+i; radio.value=j;
    radio.addEventListener("change",updateProgress);
    label.appendChild(radio);
    label.append(document.createTextNode(`${letters[j]}. ${choice}`));
    section.appendChild(label);
  });
  quiz.appendChild(section);
});

function updateProgress(){
  const count=questions.filter((_,i)=>document.querySelector(`input[name="q${i}"]:checked`)).length;
  progress.textContent=`回答済み：${count} / ${questions.length}問`;
  submit.disabled=count!==questions.length;
}

submit.addEventListener("click",()=>{
  let score=0;
  questions.forEach((item,i)=>{
    const section=document.getElementById("q"+i);
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    const chosen=Number(selected.value);
    const labels=section.querySelectorAll("label");
    labels.forEach((label,j)=>{
      if(j===item.c) label.classList.add("correct");
      if(j===chosen && chosen!==item.c) label.classList.add("wrong");
    });
    const explanation=document.createElement("div");
    explanation.className="answer";
    explanation.textContent=`正解：${letters[item.c]}. ${item.a[item.c]}`;
    section.appendChild(explanation);
    if(chosen===item.c) score++;
  });
  result.hidden=false;
  result.innerHTML=`<h2>結果：${score} / ${questions.length}点</h2><p>${score===50?"満点！すばらしい！":score>=40?"よくできました！間違えた問題を確認しよう。":"正解と解説を確認して、もう一度挑戦しよう。"}</p>`;
  submit.disabled=true;
  document.querySelectorAll('input[type="radio"]').forEach(x=>x.disabled=true);
  result.scrollIntoView({behavior:"smooth"});
});

document.getElementById("reset").addEventListener("click",()=>location.reload());
</script>
</body>
</html>
